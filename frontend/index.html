<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gestão do Atendimento · AMN</title>
<script>
  // aplica o tema salvo antes do primeiro paint (evita piscar no tema errado)
  try { const s = JSON.parse(localStorage.getItem("amn-theme") || "null"); if (s) document.documentElement.dataset.theme = s; } catch (e) {}
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
